# DFD・データ量の見積もり データ定義テンプレート（data-flow-volume スキル）
#
# 使い方:
#   1. このファイルを、成果物を置くフォルダへコピーし、名前を「<対象>_データ量・DFD.yaml」などに変える。
#   2. 下の値（すべて架空の内容）を、対象のシステムの内容に書き換える。
#   3. 生成する:
#        python .claude/skills/data-flow-volume/scripts/build_data_flow_volume.py build <このファイル>
#
# 内容はこのファイルが正であり、生成したExcelを直接編集しない。
# Excelが直接編集されたら、diff で差分を出してこのファイルへ取り込む。

# 出力するファイル名（このYAMLと同じフォルダに出力する）
output:
  xlsx: サンプル_データ量・DFD.xlsx
  png: サンプル_DFD.png

# 図の日本語フォント（任意）。省略するとOSごとの候補（メイリオ、ヒラギノ、Noto Sans CJK など）から自動で探す。
# 見つからないと言われたときだけ指定する。
# font: {regular: /path/to/NotoSansCJK-Regular.ttc, bold: /path/to/NotoSansCJK-Bold.ttc}
# Excelのセルのフォント名（任意。既定は Meiryo UI）
# excel_font: Meiryo UI

sheets:
  # ---------------------------------------------------------------------------
  # シート1：DFD（要点の欄・凡例・図）
  # ---------------------------------------------------------------------------
  - type: dfd
    name: DFD
    title: サンプルサービスのデータの流れ
    subtitle: 対象はサンプルサービスのテーブルのみ。件数は利用者1,000人・月1回実施を前提とした目安。
    # 要点の欄。見出し（label）だけで何を数えた数字かが分かるように書く
    # 「,」を含む値は、{ } や [ ] の中では区切りと見なされるため、必ず引用符で囲む
    points:
      - {label: 判定結果, value: "毎月 1,000件 × 2テーブル"}
      - {label: 1年あたり（判定結果2テーブル）, value: "約24,000件"}
      - {label: 保管, value: 3年}
      - {label: 001_一覧画面, value: 1ページ最大20件}
    # 凡例は図の上端に、使っている形・線の種類から自動で描く。説明を変えたいときだけ legend_labels で上書きする
    # 例: legend_labels: {big: テーブル（件数の多いもの）}
    # 図の大きさと、左から右へ並べる列（見出し, 中心のx座標, 幅）
    canvas: {width: 1880, height: 700}
    bands:
      - {title: データの出どころ, x: 150, width: 250}
      - {title: サンプルサービスの処理, x: 520, width: 290}
      - {title: サンプルサービスのテーブル, x: 930, width: 330}
      - {title: 表示・出力の処理, x: 1340, width: 290}
      - {title: 表示・出力先, x: 1720, width: 270}
    # 図の要素。kind は ext（画面・他のシステム）／proc（処理）／store（テーブル）／big（件数の多いテーブル）／file（ファイル）
    # x・y は中心の座標、w・h は幅と高さ。画面は画面設計書の画面ID付きの名前で1画面ずつ書く
    nodes:
      ADM: {kind: ext, x: 150, y: 170, w: 210, h: 90, text: "010_設定画面"}
      EXT: {kind: ext, x: 150, y: 430, w: 210, h: 90, text: "外部システムA"}
      P2: {kind: proc, x: 520, y: 170, w: 150, h: 150, text: "② 設定を\n保存する"}
      P1: {kind: proc, x: 520, y: 430, w: 150, h: 150, text: "① 判定する"}
      D3: {kind: store, x: 930, y: 170, w: 250, h: 90, text: "設定マスタ\n数件"}
      D1: {kind: big, x: 930, y: 380, w: 250, h: 100, text: "判定結果\n1,000件／月"}
      D2: {kind: big, x: 930, y: 530, w: 250, h: 100, text: "判定明細\n1,000件／月"}
      P3: {kind: proc, x: 1340, y: 380, w: 150, h: 150, text: "③ 判定を\n表示する"}
      P4: {kind: proc, x: 1340, y: 170, w: 150, h: 150, text: "④ CSVを\n作る"}
      S001: {kind: ext, x: 1720, y: 300, w: 230, h: 80, text: "001_一覧画面"}
      S002: {kind: ext, x: 1720, y: 470, w: 230, h: 80, text: "002_詳細画面"}
    # データの流れ。原則として左から右へ流す。依頼・要求の線は描かない
    # style は bold（件数の多い流れ）／solid（通常、既定）／dash（読むだけ）／both（双方向）
    # pos は文言を置く位置（0＝始点〜1＝終点、既定0.5）
    # offset は同じ2要素の間を2本で結ぶときに、線を平行にずらす幅
    flows:
      - {from: EXT, to: P1, label: "判定依頼\n1,000件／月", style: bold}
      - {from: D3, to: P1, label: 有効な設定, style: dash}
      - {from: P1, to: D1, label: "1,000件／月", style: bold}
      - {from: P1, to: D2, label: "1,000件／月", style: bold}
      - {from: ADM, to: P2, label: 設定内容}
      - {from: P2, to: D3}
      - {from: D1, to: P3}
      - {from: D2, to: P3}
      - {from: P3, to: S001, label: "一覧\n1ページ最大20件"}
      - {from: P3, to: S002, label: 判定結果・明細}
      - {from: D1, to: P4, label: "1回1,000行"}
      - {from: P4, to: S001, label: "CSVをダウンロード"}

  # ---------------------------------------------------------------------------
  # シート2：テーブル別データ量
  # ---------------------------------------------------------------------------
  - type: table
    name: テーブル別データ量
    title: テーブル別のデータ量と使われ方
    subtitle: 1回あたり・1年あたりは件数の目安。
    # 「データが入るきっかけ」「登録後の更新」「保持」「削除のきっかけ」で、作成から削除までのライフサイクルが1行で追えるようにする
    header: [No., 分類, テーブル, 物理名, データが入るきっかけ, 使われる場所, 1回あたり, 1年あたり, 登録後の更新, 保持, 削除のきっかけ]
    # 列幅（Excelの列幅の単位）。行の高さは文字量から自動で決まる
    widths: [5, 9, 20, 22, 34, 24, 12, 16, 18, 12, 26]
    # 分類の列（0から数える）と、分類ごとの塗り色
    category_column: 1
    category_fill: {判定結果: E2F2E2, 設定: FFF4E0}
    rows:
      - [1, 判定結果, 判定結果, sample.judge_result, 外部システムAからの判定依頼, 001_一覧画面、002_詳細画面、CSV, "1,000件", "12,000件", 無し, 3年, 3年を過ぎたものを月1回まとめて削除]
      - [2, 判定結果, 判定明細, sample.judge_detail, 判定結果の保存と同時（判定1件につき1件）, 002_詳細画面, "1,000件", "12,000件", 無し, 3年, 判定結果の削除と同時]
      # 運用が決まっていないものは「最大○件」と上限で書き、運用未定であることを添える
      - [3, 設定, 設定マスタ, sample.setting_master, "010_設定画面で保存したとき\n※運用は未定", 判定時に参照, "-", 最大10件, 変更時に更新, 削除しない, "-"]
    # 合計行（不要なら省略する）
    total: ["", 合計, 判定結果（No.1〜2）, "", "", "", "2,000件", "24,000件", "", "", ""]

  # ---------------------------------------------------------------------------
  # シート3：前提（出典は、ファイルのフルパス・シート名・行番号まで省略せずに書く）
  # ---------------------------------------------------------------------------
  - type: table
    name: 前提
    title: 件数を見積もった前提
    header: [項目, 内容, 出典]
    widths: [30, 60, 110]
    rows:
      - [対象の利用者数, "1,000人", 利用部門ヒアリング（定例会議での回答）]
      - [実施の頻度, 月1回 → 年12回, "要件定義書_サンプル.xlsx　シート「機能要件」20行目"]
      - [保持期間, 3年, "要件定義書_サンプル.xlsx　シート「非機能要件」35行目"]
      - [一覧画面の表示件数, 1ページに10件／20件から選ぶ, "docs/サンプル/画面設計書.xlsx　シート「001_一覧画面」No.5「表示件数選択」"]
      - [設定の改版, 半年は改版しない見込み, 担当者名の見込み（YYYY-MM-DD時点）]

  # ---------------------------------------------------------------------------
  # シート4：打合せで決めたいこと（TODOとは書かない。論点・案・影響の3列で書く）
  # ---------------------------------------------------------------------------
  - type: table
    name: 打合せで決めたいこと
    title: 打合せで決めたいこと
    subtitle: 案は、要件定義の記載とYYYY-MM-DD時点の設計をもとにしたもの。
    header: [No., 決めたいこと, 案, 決まらないと何に影響するか]
    widths: [5, 28, 45, 60]
    rows:
      - [1, 保持期間を過ぎたデータの削除方法, 月1回、保持期間を過ぎた判定結果をまとめて削除する。, "削除しない場合、年24,000件ずつ増え続ける。"]
      - [2, 設定マスタの件数の想定, ご意向を伺いたい。, 設定マスタの件数を数字で示せない。]
