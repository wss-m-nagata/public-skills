<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search List</title><!--
このHTMLは画面構成・レイアウトを示すための参考資料です。
DOM構造、CSS、クラス名そのものを実装規約として指定するものではありません。
実装時は docs/rules/screen-design-rules/ のMarkdown規約を優先してください。
-->
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{height:48px;background:#fff;border-bottom:1px solid #ccc;display:flex;align-items:center;padding:0 16px}
.app{display:grid;grid-template-columns:256px 1fr;min-height:calc(100vh - 48px)}
aside{background:#fff;border-right:1px solid #ccc;padding:16px}
main{padding:24px}.card{background:#fff;border:1px solid #ccc;padding:16px;margin-bottom:16px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}.actions{display:flex;justify-content:flex-end;gap:8px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ccc;padding:8px;text-align:left}
input,select,button{min-height:36px;padding:6px 8px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{display:none}}
</style>
</head><body>
<header><strong>System Name</strong><span style="margin-left:auto">User / Utility</span></header>
<div class="app"><aside><strong>Side Navigation</strong></aside><main>
<div class="card"><small>Breadcrumb</small><div class="row" style="justify-content:space-between"><h1>ユーザー一覧</h1><button>新規登録</button></div></div>
<div class="card"><h2>検索条件</h2><div class="row"><label>氏名 <input></label><label>部署 <select><option>選択</option></select></label></div><div class="actions"><button>クリア</button><button>検索</button></div></div>
<div class="card"><h2>一覧</h2><table><tr><th>ID</th><th>氏名</th><th>部署</th><th>操作</th></tr><tr><td>001</td><td>山田 太郎</td><td>営業部</td><td><button>詳細</button></td></tr></table></div>
</main></div></body></html>
