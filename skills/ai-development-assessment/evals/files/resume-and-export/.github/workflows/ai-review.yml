name: AI Review
on: [pull_request]
jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AI code review
        run: python scripts/ai_review.py --diff "${{ github.event.pull_request.diff_url }}"
      - name: Post findings as PR comment
        run: python scripts/post_review_comment.py
