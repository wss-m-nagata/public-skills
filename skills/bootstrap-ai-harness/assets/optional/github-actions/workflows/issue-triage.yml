# Revision History
# <YYYY/MM/DD>: <会社の略称><氏名>: Issueの起票時に、Claude Code Actionでラベルを自動で付けるワークフローを新規作成。
#   - 付けるラベルは、リポジトリのラベル一覧から、ラベルの説明をもとに選ばせる。
#   - 書き込み権限のない利用者の起票では動かない（allowed_non_write_users は指定しない）。

name: Claude Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code for Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          # .claude/commands/label-issue.md と scripts/ 配下のスクリプトを使う
          prompt: "/label-issue REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
