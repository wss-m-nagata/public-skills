# Revision History
# <YYYY/MM/DD>: <会社の略称><氏名>: 新規作成。
#   - レビューの重点は `.github/claude/code-review-focus.md` に書き、`--append-system-prompt-file` で読ませる。
#   - 差分の外のファイルを調べられるよう、Read・Glob・Grep を許可している。

name: Claude Code Review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'code-review@claude-plugins-official'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # 重点を書いたファイルを読ませる（このワークフローだけに適用される）。差分の外を調べるため、Read・Glob・Grep を許可する
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep" --append-system-prompt-file .github/claude/code-review-focus.md'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

