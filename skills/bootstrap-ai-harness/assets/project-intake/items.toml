example = ""
reflect = ".claude/skills/、AGENTS.md のスキルの一覧"

[[sheets]]
key = "infra"
kind = "items"
name = "インフラ"
summary = "AWSの環境、ネットワーク、デプロイの前提。"
lead = ["AWSの環境、ネットワーク、デプロイの前提。", "黄色の「記入欄」に記入します。任意の項目は、空欄なら既定値を使います。"]

[[sheets.items]]
id = "infra.aws_id"
name = "AWS識別名"
required = "必須"
description = "AWSのリソースの名前の先頭に付ける名前。英小文字。"
example = "asset"
note = """
AWSのリソース（Lambda、S3など）の名前の先頭に付ける、このアプリを表す短い名前。
ほかのアプリのリソースと区別するために使う。"""
reflect = "docs/20_rules/AWSリソース命名規則.md の識別名"

[[sheets.items]]
id = "infra.envs"
name = "環境名"
required = "必須"
description = "作る環境の名前。複数あればカンマで区切る。"
example = "dev, prod"
note = """
環境：同じアプリを用途ごとに分けて動かす場所。
例：dev（開発）、stg（検証）、prod（本番）。"""
reflect = "docs/20_rules/AWSリソース命名規則.md の環境名"

[[sheets.items]]
id = "infra.region"
name = "リージョン"
required = "任意"
description = "使うAWSのリージョン。"
example = "既定のまま"
default = "ap-northeast-1（東京）"
note = "AWSのデータセンターがある地域。日本なら ap-northeast-1（東京）か ap-northeast-3（大阪）。"
reflect = "docs/20_rules/AWSリソース命名規則.md のリージョン"

[[sheets.items]]
id = "infra.service_abbr"
name = "サービス略称"
required = "必須"
description = "AWSの名前に使う、サービスごとの短い名前。"
example = "lending → lnd"
note = "AWSのリソースの名前は長さに上限があるため、サービス名を短くした名前を使う。"
reflect = "docs/20_rules/AWSリソース命名規則.md のサービスの略称の一覧"

[[sheets.items]]
id = "infra.aws_mfa"
name = "AWSへのサインインの2要素認証"
required = "必須"
description = """
開発者がAWSにサインインするとき、2要素認証（MFA）が必要か。アプリの画面のログインとは別。選択：あり／なし／不明
不明のとき：AIが確かめ方を案内し、人がAWSに接続して確かめ、この欄を直す。確かめるまでは、未決定事項として報告する。"""
example = "あり"
choices = ["あり", "なし", "不明"]
note = """
開発者がAWS（画面やコマンド）にサインインするときの話。アプリの画面のログインとは別。
2要素認証（MFA）：パスワードに加えて、スマートフォンのアプリなどのコードでも本人を確かめる仕組み。
ありの場合、AWSのコマンドを使う前に、コードを入力する手順が要る。
確かめ方：AWSの画面（IAM）で、自分のユーザーに「MFAデバイス」が登録されているか。社内の決まりで必須かどうかは、AWSの管理者に確かめる。"""
reflect = "インストール手順の、AWSにサインインする手順"

[[sheets.items]]
id = "infra.api_origin"
name = "APIの公開方式"
required = "任意"
description = "CloudFrontからサービスのAPIへ転送するときの接続先を選ぶ。"
choices = ["Lambda 関数 URL", "API Gateway"]
default = "Lambda 関数 URL"
example = "Lambda 関数 URL"
note = "API Gatewayを選ぶと、CloudFrontは各サービスのREST APIへ転送する。旧版の入力シートにこの項目がない場合もLambda 関数 URLを使う。"
reflect = "AWSインフラ設計書、アーキテクチャ、CDK作成方針、デプロイ手順"

[[sheets.items]]
id = "infra.domain"
name = "ドメイン"
required = "任意"
description = "画面を公開するドメイン。決まっていなければ空欄。"
example = "asset.example.com"
default = "CloudFrontが付けるドメイン（*.cloudfront.net）"
note = "画面のアドレス（URL）の、https:// の後ろの部分。例：asset.example.com"
reflect = "docs/20_rules/アーキテクチャ.md の「画面とAPIの転送」"

[[sheets.items]]
id = "infra.ip_restriction"
name = "IP制限をかけるか"
required = "任意"
description = "決まった場所（社内のネットワークなど）からだけ、画面とAPIを使えるようにするか。選択：かける／かけない"
example = "既定のまま"
default = "かける"
choices = ["かける", "かけない"]
note = """
IP制限：決まったIPアドレスから来たアクセスだけを通し、ほかはすべて断る仕組み。AWS WAF という機能で行う。
画面とAPIはどちらもCloudFrontを通るため、1か所の設定で両方にかかる。
社外に公開するなど、かけられない事情があるときだけ「かけない」を選ぶ。"""
reflect = "AWSインフラ設計書、アーキテクチャのIP制限、AWSリソース命名規則、デプロイ手順"

[[sheets.items]]
id = "infra.allowed_ips"
name = "許可するIPアドレス"
required = "条件付き必須"
required_if = { id = "infra.ip_restriction", equals = "かける" }
description = "IP制限をかける場合に、アクセスを許可するグローバルIPアドレス。複数あればカンマで区切る。決まっていなければ「未定」と書く（本番の環境を作るまでに決める）。"
example = "203.0.113.10/32, 203.0.113.20/32"
note = """
社内のネットワークや VPN が、インターネットに出るときのIPアドレス（グローバルIP）を書く。
社内のPCで確かめるIPアドレス（192.168.… など）ではない。
IPアドレスが固定であることが前提。分からなければ、社内のネットワークの担当者に確かめる。
「未定」のときは、本番の環境を作るまでに決める。"""
reflect = "資料には書かない。インフラのコードを作るときに、入力シートから読んで設定に使う"

[[sheets.items]]
id = "infra.vpc"
name = "既存のVPCを使うか"
required = "必須"
description = """
Lambdaなどを既存のVPCに置くか。選択：使う／新しく作る／VPCを使わない／不明
不明のとき：AIが確かめ方を案内し、人がAWSに接続して確かめ、この欄を直す。確かめるまでは、未決定事項として報告する。"""
example = "使う"
choices = ["使う", "新しく作る", "VPCを使わない", "不明"]
note = """
VPC：AWSの中に作る、社内専用のネットワーク。
社内のDBや、ほかのシステムにつなぐ場合は、既存のVPCを使うことが多い。
分からなければ「不明」を選ぶ。
確かめ方：AWSの画面（VPC）に、このアプリで使うVPCがあるか。どれを使うかは、AWSの管理者に確かめる。"""
reflect = "docs/20_rules/アーキテクチャ.md のインフラ"

[[sheets.items]]
id = "infra.vpc_id"
name = "既存のVPCの名前・ID"
required = "条件付き必須"
required_if = { id = "infra.vpc", equals = "使う" }
description = "既存のVPCを使う場合に書く。環境ごとに違えば、環境ごとに書く。"
example = "dev: vpc-0123456789abcdef0"
note = "VPCのID：vpc- で始まる番号。AWSの画面（VPC）で確かめられる。"
reflect = "資料には書かない。インフラのコードを作るときに、入力シートから読んで設定に使う"

[[sheets.items]]
id = "infra.oidc"
name = "OIDCプロバイダーの有無"
required = "条件付き必須"
required_if = { id = "infra.deploy", equals = "GitHub Actions" }
description = """
GitHub ActionsでデプロイするときにAWSへ接続するための設定が、AWSアカウントにあるか。選択：あり／なし／不明
なしのとき：AIが作り方の手順を手順書に書き、人がAWSに接続して1回だけ作る。
不明のとき：AIが確かめ方を案内し、人がAWSに接続して確かめ、この欄を直す。確かめるまでは、未決定事項として報告する。"""
example = "不明"
choices = ["あり", "なし", "不明"]
note = """
GitHub Actions（GitHubの自動実行の機能）から、パスワードやキーを保存せずにAWSへ接続するための設定。
AWSのアカウントに1つしか作れない。ほかのアプリで作っていれば「あり」。
実際は「あり」なのに「なし」と答えると、作るときにエラーになる。迷ったら「不明」を選ぶ。
確かめ方：AWSの画面（IAM）の「IDプロバイダー」に token.actions.githubusercontent.com があるか。"""
reflect = "CDK作成方針、デプロイ手順の管理基盤（なしのときの作り方）"

[[sheets.items]]
id = "infra.cdk_bootstrap"
name = "cdk bootstrap が済んでいるか"
required = "任意"
description = """
使うAWSのアカウントとリージョンで、CDKを使う準備が済んでいるか。人ごとではなく、アカウントとリージョンの組ごとに1回だけ行う。選択：済み／まだ／不明
まだのとき：AIが手順を手順書に書き、人がAWSに接続して1回だけ行う。
不明のとき：AIが確かめ方を案内し、人がAWSに接続して確かめ、この欄を直す。確かめるまでは、未決定事項として報告する。"""
example = "済み"
default = "不明（確かめ方を案内する）"
choices = ["済み", "まだ", "不明"]
note = """
AWS CDK（AWSのリソースをプログラムで作る道具）を使う前に行う準備。CDKがデプロイに使うS3のバケットや権限を作る。
人ごとではなく、AWSのアカウントとリージョンの組ごとに1回だけ行う。ほかのアプリでCDKを使っていれば、済んでいることが多い。
IP制限をかける場合は、使うリージョン（東京など）に加えて、us-east-1（バージニア北部）でも要る。CloudFront用のWAFは、us-east-1に作る決まりだから。
確かめ方：AWSの画面（CloudFormation）で、リージョンごとに CDKToolkit というスタックがあるか。"""
reflect = "デプロイ手順の新しい環境の構築（未実施の対象をAWSアカウントの管理者が準備する）"

[[sheets.items]]
id = "infra.deploy"
name = "デプロイの方法"
required = "任意"
description = "デプロイを何で行うか。"
example = "既定のまま"
default = "GitHub Actions"
note = """
デプロイ：作ったプログラムを、AWSの環境に反映すること。
GitHub Actions：GitHubで、決まった操作（テスト、デプロイなど）を自動で実行する機能。"""
reflect = "docs/20_rules/アーキテクチャ.md のデプロイ"

[[sheets.items]]
id = "infra.deploy_rules"
name = "環境ごとのデプロイの担当と条件"
required = "任意"
description = "環境ごとに、誰が、どのタイミングでデプロイするか。"
example = "dev: mainへのマージで自動。prod: 承認者が手動で実行。"
reflect = "docs/20_rules/アーキテクチャ.md の {{対象プロジェクトで採用するワークフローと実行条件}}"

[[sheets]]
key = "screen"
kind = "items"
name = "画面"
summary = "画面規約の前提。ブランドカラー・対応端末・画面の一覧以外は既定値を使える。"
lead = ["画面規約の前提。ブランドカラー・対応端末・画面の一覧以外は既定値を使える。", "黄色の「記入欄」に記入します。任意の項目は、空欄なら既定値を使います。"]

[[sheets.items]]
id = "screen.brand_color"
name = "ブランドカラー"
required = "必須"
description = """
このWebサイトを象徴する色。ボタン・選択中の表示・リンクに使う。会社のロゴの色や、好みの色を書く。16進数で書くか、分からなければ「濃い緑」のように言葉で書く。
特に無ければ「指定なし」と書く（DADSの既定の青を使う）。"""
example = "#3460fb"
note = """
このWebサイトを象徴する色。ボタンやリンクなど、主な操作の色に使う。
決め方の例：会社のロゴやコーポレートカラーの色、サービスのイメージに合う色、好みの色。
16進数（#3460fb など）が分からなければ、「濃い緑」のように言葉で書いてもよい。
ボタンやリンクの文字にも使うため、白い背景で読みにくい明るい色のときは、AIが同じ色合いで濃さを変えた案を出す。"""
reflect = "画面規約（generate-screen-design-rules に渡す）"

[[sheets.items]]
id = "screen.devices"
