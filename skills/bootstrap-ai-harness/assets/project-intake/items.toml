lead = ["作る画面を1行に1つ書きます。メニューに出す画面は、メニューの階層も書きます。", "URLは決まっていなければ空欄にします（URLの付け方に沿ってAIが案を出します）。"]
rows = 40
required_rows = 1

[[sheets.columns]]
id = "menu1"
name = "メニュー（第1階層）"
width = 20
example = "備品"

[[sheets.columns]]
id = "menu2"
name = "メニュー（第2階層）"
width = 20
example = "備品台帳"

[[sheets.columns]]
id = "name"
name = "画面名"
width = 24
example = "備品一覧"

[[sheets.columns]]
id = "url"
name = "URL"
width = 34
example = "/asset/ledger/list"

[[sheets.columns]]
id = "kind"
name = "画面の種類"
width = 16
example = "検索・一覧"
choices = ["検索・一覧", "詳細", "登録・編集", "参照・編集", "ダッシュボード", "その他"]

[[sheets.columns]]
id = "summary"
name = "画面の概要"
width = 44
example = "備品を条件で探し、一覧で表示する。"

[[sheets.columns]]
id = "users"
name = "主な利用者"
width = 18
example = "総務部の担当者"

[[sheets.columns]]
id = "note"
name = "補足"
width = 30
example = "メニューから開く"

[[sheets]]
key = "harness"
kind = "items"
name = "ハーネスの設定"
summary = "スキルの導入先や、Claude Codeのおすすめの設定。"
lead = ["スキルの導入先や、Claude Codeのおすすめの設定。", "黄色の「記入欄」に記入します。任意の項目は、空欄なら既定値を使います。"]

[[sheets.items]]
id = "harness.skills_repo"
name = "公開スキルのリポジトリ"
required = "必須"
description = "設計書・図などのスキルを導入する、公開スキルのGitHubリポジトリ（owner/repository）。"
example = "example-org/agent-skills"
note = """
スキル：AIに作業の手順を教えるファイル。
設計書や図を作るスキルを、このリポジトリから取り込む。"""
reflect = ".agents/config/bootstrap-ai-harness/settings.md の「公開スキルのリポジトリ」"

[[sheets.items]]
id = "harness.app_root"
name = "アプリのルート"
required = "任意"
description = "保存時の整形の対象にするディレクトリ。リポジトリの直下にアプリがあるときは「.」。"
example = "既定のまま"
default = "."
note = "アプリのファイルを置く一番上のフォルダ。リポジトリの直下にアプリがあれば「.」。"
reflect = ".agents/config/bootstrap-ai-harness/settings.md の「アプリのルート」"

[[sheets.items]]
id = "harness.permissions"
name = "承認なしの許可・確認・禁止"
required = "任意"
description = "Claude Codeの、おすすめの許可の設定を入れるか。選択：する／しない"
example = "する"
default = "する"
choices = ["する", "しない"]
note = "AIがコマンドを実行するとき、毎回確認を求めずに実行してよいもの、確認を求めるもの、禁止するものの設定。"
reflect = ".agents/config/bootstrap-ai-harness/settings.md、.claude/settings.json"

[[sheets.items]]
id = "harness.formatter_hooks"
name = "保存時の整形のフック"
required = "任意"
description = "ファイルの保存時に、自動で整形するか。選択：する／しない"
example = "する"
default = "する"
choices = ["する", "しない"]
note = """
ファイルを保存するたびに、書き方（字下げ、改行など）を自動でそろえる設定。
Prettier：画面のプログラム用。Black：Python用。"""
reflect = ".agents/config/bootstrap-ai-harness/settings.md、.claude/settings.json"

[[sheets.items]]
id = "harness.github_actions"
name = "GitHub Actions"
required = "任意"
description = "PRのAIレビューなどの、GitHub Actionsのひな形を入れるか。選択：する／しない"
example = "する"
default = "しない"
choices = ["する", "しない"]
note = """
GitHubで、決まった操作を自動で実行する機能。
PRのAIレビュー：変更の依頼（プルリクエスト）をAIが確かめる。
Issueの自動ラベル付け：課題に、種類のラベルを自動で付ける。"""
reflect = ".agents/config/bootstrap-ai-harness/settings.md、.github/"

[[sheets.items]]
id = "harness.github_actions_features"
name = "GitHub Actionsで使う機能"
required = "条件付き必須"
required_if = { id = "harness.github_actions", equals = "する" }
description = "GitHub Actionsを入れる場合に、使う機能をカンマで区切って書く。PRのAIレビュー、Issueの自動ラベル付け、デプロイ前のテスト"
example = "PRのAIレビュー, Issueの自動ラベル付け"
reflect = ".agents/config/bootstrap-ai-harness/settings.md の備考"

[[sheets.items]]
id = "harness.github_actions_ack"
name = "GitHub Actionsの前提の了解"
required = "条件付き必須"
required_if = { id = "harness.github_actions", equals = "する" }
description = "GitHub Actionsを入れる場合に、シークレットの登録・費用・起票者の権限の前提を了解したか。選択：了解した"
example = "了解した"
choices = ["了解した"]
note = """
シークレット：AIを使うためのキーを、GitHubに登録する必要がある。
費用：AIの利用料がかかる。
起票者の権限：自動で動くのは、権限のある人が起票した課題だけ。"""
reflect = ".agents/config/bootstrap-ai-harness/settings.md の備考"
