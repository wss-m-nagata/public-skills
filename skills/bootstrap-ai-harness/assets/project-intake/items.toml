# 入力シート（プロジェクト入力シート.xlsx）の項目の正本。
# Excel のひな形と記入要領（references/intake-guide.md）は、scripts/project-intake/build_intake.py でここから作る。
# 項目を変えたら、build_intake.py を実行して、Excel と記入要領を作り直す。
# 記入例は、架空のアプリ「備品管理システム」の値にする（このファイルは公開される）。

[guide]
title = "AI駆動開発の環境づくり 入力シート"

[[guide.usage]]
label = "このシートについて"
text = """
このExcelを埋めて bootstrap-ai-harness スキルを呼ぶと、AI駆動開発の環境（規約・AI向けの指示・資料の置き場所など）を作ります。
必須の項目がすべて埋まっていれば、AIは質問せずに作業を進めます。"""

[[guide.usage]]
label = "記入するセル"
text = """
黄色のセル（記入欄）だけに記入します。ほかのセルは変えません。
項目の表には、AIが項目を見分けるための列（ID）が隠れています。行や列を消したり、入れ替えたりしません。"""

[[guide.usage]]
label = "必須・任意"
text = """
必須：必ず記入します。
条件付き必須：説明に書いた条件に当てはまるときだけ記入します。
任意：空欄のときは「既定値」の値を使います。既定値と違う値にするときだけ記入します。"""

[[guide.usage]]
label = "言葉の補足"
text = "項目のセルの右上に赤い印があるものは、マウスを合わせると、言葉の補足が出ます。"

[[guide.usage]]
label = "決まっていないとき"
text = "「未定」と書きます。AIは、未定の項目を推測で埋めず、未決定事項として報告します。"

[[guide.usage]]
label = "書いてはいけないもの"
text = "パスワード、トークン、秘密鍵、接続文字列などの秘密情報は書きません。"

[[guide.usage]]
label = "記入例"
text = "記入例は、架空のアプリ「備品管理システム」のものです。灰色の文字の行やセルは書き換えません。"

[guide.consult]
lead = ["書き方が分からない項目や、自分のプロジェクトでどう答えればよいか分からない項目は、AIに相談できます。", "Claude Code に、下のテンプレートを貼り、【】の部分を書き換えて指示します。", "AIは bootstrap-ai-harness スキルを使い、このExcelの書き方に沿って答えます。"]
footnote = "※ フルパスは、エクスプローラーでファイルを右クリックし、「パスのコピー」で取れます。"

[[guide.consult.prompts]]
purpose = "項目の意味を聞く"
text = """
bootstrap-ai-harness スキルを使って、入力シートの書き方を教えてください。
入力シート：【このExcelのフルパス】
シートと項目：【例：インフラシートの「既存のVPCを使うか」】
聞きたいこと：【例：何を選べばよいか分からない】
分かっていること：【例：社内のDBにつなぐ予定がある】"""

[[guide.consult.prompts]]
purpose = "資料から下書きを作ってもらう"
text = """
bootstrap-ai-harness スキルを使って、入力シートの下書きを作ってください。
入力シート：【このExcelのフルパス】
読んでほしい資料：インプット資料シートに書いた資料
下書きしてほしいシート：【例：プロジェクト概要、画面とメニュー】
資料から分からない項目は空欄のままにし、誰に何を確かめればよいかを一覧にしてください。"""

[[guide.consult.prompts]]
purpose = "記入漏れを確かめてもらう"
text = """
bootstrap-ai-harness スキルを使って、入力シートの記入漏れと、項目どうしの食い違いを確かめてください。
入力シート：【このExcelのフルパス】
Excelは直さず、結果だけ教えてください。"""

[[guide.consult.prompts]]
purpose = "環境を作ってもらう"
text = """
bootstrap-ai-harness スキルを使って、入力シートの内容で、AI駆動開発の環境を作ってください。
入力シート：【このExcelのフルパス】
作る場所：【新しいアプリのリポジトリのフルパス】"""

[[sheets]]
key = "project"
kind = "items"
name = "プロジェクト概要"
summary = "今回のプロジェクトは何で、目的は何か。"
lead = ["今回のプロジェクトは何で、目的は何か。", "黄色の「記入欄」に記入します。任意の項目は、空欄なら既定値を使います。"]

[[sheets.items]]
id = "project.name"
name = "プロジェクト名"
required = "必須"
description = "資料・リポジトリ・画面で使う正式な名前。"
example = "備品管理システム"
reflect = "README.md、AGENTS.md の名前"

[[sheets.items]]
id = "project.summary"
name = "何を作るか"
required = "必須"
description = "今回作るアプリを1〜3文で書く。"
example = "社内の備品（PC・モニターなど）の台帳と貸出を、画面から管理するWebアプリ。"
reflect = "README.md、AGENTS.md の概要"

[[sheets.items]]
id = "project.purpose"
name = "目的"
required = "必須"
description = "解決したい課題と、得たい効果。"
example = "Excelの台帳と紙の貸出記録をなくし、所在が分からない備品と、棚卸の作業時間を減らす。"
reflect = "README.md の目的"

[[sheets.items]]
id = "project.background"
name = "背景"
required = "任意"
description = "このプロジェクトを始めた経緯。インプット資料に書いてあれば、その資料名だけでよい。"
example = "要件定義書「1. 背景」を参照。"
reflect = "README.md（必要な場合だけ）"

[[sheets.items]]
id = "project.users"
name = "利用者"
required = "必須"
description = "誰が、どこから、どのくらいの人数で使うか。"
example = "総務部の担当者（約10名）と、備品を借りる社員。社内のPCから使う。"
reflect = "README.md、docs/20_rules/アーキテクチャ.md の利用者"

[[sheets.items]]
id = "project.scope"
name = "対象範囲"
required = "必須"
description = "今回作る範囲（機能・業務）。"
example = "備品台帳、貸出と返却、発注の管理。"
reflect = "README.md、docs/20_rules/アーキテクチャ.md の対象範囲"

[[sheets.items]]
id = "project.out_of_scope"
name = "対象外"
required = "任意"
description = "今回は作らないと決めているもの。"
example = "会計システムとの自動連携（次の段階で行う）。"
reflect = "README.md の対象範囲（対象外として）"

[[sheets.items]]
id = "project.milestones"
name = "期限・マイルストーン"
required = "任意"
description = "リリースの時期や、区切りの日付。"
example = "2027/03 本番リリース"
reflect = "資料には書かない（課題管理先で管理する）"

[[sheets.items]]
id = "project.reviewer"
name = "レビュー・コミットする人"
required = "任意"
description = "AIの変更をレビューし、コミットする人。改版履歴の担当者に使う。会社の略称＋氏名。"
example = "ABC山田 太郎"
reflect = "改版履歴の担当者（スクリプトの --author）。空欄なら、AIは推測せず、記入用の表記のまま残す"

[[sheets.items]]
id = "project.repository"
name = "リポジトリ"
required = "任意"
description = "GitHubのリポジトリ（owner/name）。まだ無ければ空欄。"
example = "example-org/asset-management"
reflect = "README.md、Issueテンプレート、GitHub Actions の設定"

[[sheets]]
key = "inputs"
kind = "list"
name = "インプット資料"
summary = "要件定義書・企画書など、前段の資料の場所と、見てほしいところ。"
lead = ["要件定義書・企画書・業務フローなど、このプロジェクトの前提になる資料を1行に1つ書きます。", "場所は、ファイルサーバーならフルパス（\\\\サーバー名\\共有名\\...）、Webならリンクを書きます。", "AIが読む範囲を絞れるよう、見てほしいシート・ページと、そこに何が書いてあるかを書きます。", "資料名を書いた行は、「場所」と「見てほしいシート・ページ」も書きます（未記入として数えます）。"]
rows = 20
required_with = ["location", "pages"]

[[sheets.columns]]
id = "name"
name = "資料名"
width = 26
example = "備品管理 要件定義書"

[[sheets.columns]]
id = "kind"
name = "種類"
width = 14
example = "要件定義"
choices = ["企画", "要件定義", "業務フロー", "画面イメージ", "用語集", "既存システムの資料", "その他"]

[[sheets.columns]]
id = "location"
name = "場所（フルパスまたはリンク）"
width = 50
example = "\\\\fileserver\\share\\asset-mgmt\\10_要件定義\\備品管理_要件定義書_v1.2.xlsx"

[[sheets.columns]]
id = "pages"
name = "見てほしいシート・ページ"
width = 30
example = "「機能一覧」「画面一覧」シート"

[[sheets.columns]]
id = "summary"
name = "記載内容の概要"
width = 44
example = "「機能一覧」に作る機能と優先度、「画面一覧」に画面名と利用者。"

[[sheets.columns]]
id = "note"
name = "補足（優先度、版、注意点など）"
width = 40
example = "v1.2が最新。「非機能」シートは未確定なので参考程度。"

[[sheets]]
key = "app"
kind = "items"
name = "アプリ構成"
summary = "業務の塊（サービス）、DB、外部連携、認証などの構成。"
lead = ["このアプリは、画面（フロントエンド）を1つ作り、バックエンドを業務の塊（サービス）ごとに分けて作ります。", "下の図で構成を確かめてから、黄色の「記入欄」に記入します。任意の項目は、空欄なら既定値を使います。"]
figure = "service_figure.png"

[[sheets.items]]
id = "app.services"
name = "業務の塊（サービス）の分け方"
required = "任意"
description = "上の図のように、バックエンドを業務の塊（サービス）ごとに分けます。塊の名前と、扱う業務・データを、1行に1つ書きます。分け方は図の右の目安を見ます。分からなければ空欄にします。"
example = """
備品：備品台帳の登録・参照
貸出：貸出と返却の記録"""
default = "サービスを1つにする（アプリ全体を1つのサービスで作る）"
note = """
サービス：バックエンドを分ける単位。サービスごとに、API・データ（テーブル）・資料を持つ。
分け方が分からなければ空欄にする。サービスを1つにして始め、後から分けることもできる。"""
reflect = "docs/20_rules/アーキテクチャ.md のサービスと責務、service-template と service-root-template の適用先（backend/<サービス名>/）"

[[sheets.items]]
id = "app.service_stack"
name = "サービスの言語と依存管理"
required = "任意"
description = "業務の塊（サービス）ごとの言語・部品の管理・テストの道具。"
example = "既定のまま"
default = "Python、uv、pytest"
note = """
依存管理：使う部品（ライブラリ）とその版を管理すること。
uv：Pythonの部品を管理する道具。
pytest：Pythonの単体テストの道具。"""
reflect = "サービスのアーキテクチャ、backend/<サービス名>/AGENTS.md の技術スタック"

[[sheets.items]]
id = "app.database"
name = "使うデータベース"
required = "必須"
description = """
このアプリはデータベース（DB）を使う前提で作る。使うDBの種類と、新しく作るか既存のDBを使うかを書く。
未定のとき：AWSの環境のDBが無いため、開発者のPCで動かすDBを使い、開発者のPCでだけ動作確認できる形で環境を作る。AWSの環境での動作確認は、DBが決まってからにする。"""
example = "PostgreSQL（Amazon Aurora）。新しく作る。"
note = """
データベース（DB）：アプリのデータを保存する場所。
種類：PostgreSQL、MySQL など。AWSでは、Amazon Aurora や Amazon RDS で動かすことが多い。
既存のDB：ほかのシステムがすでに使っているDBに、このアプリのテーブルを置くこと。
未定のときは、開発者のPCで動かすDBを使い、開発者のPCでだけ動作確認する。"""
reflect = "全体とサービスのアーキテクチャの {{DBの責任分界}}、インストール手順、ローカル動作確認手順"

[[sheets.items]]
id = "app.db_owner"
name = "DBの所有者と変更責任"
required = "任意"
description = "DBを持つ部署と、テーブルの追加・変更を誰が行うか。"
example = "所有は総務部。テーブルの変更は開発チームが行う。"
default = "開発チームが持ち、テーブルの変更も開発チームが行う"
note = """
所有者：DBを持ち、運用する部署。
変更責任：テーブルの追加・変更（DDL、マイグレーション）を誰が行うか。
既存のDBを使う場合は、そのDBを持つ部署に確かめる。"""
reflect = "全体とサービスのアーキテクチャの {{DBの責任分界}}"

[[sheets.items]]
id = "app.test_db"
name = "テスト用のDB"
required = "任意"
description = "テストで使うDBと管理者。"
example = "既定のまま"
default = "テスト専用のDBを使う"
note = "本番のデータを壊さないよう、テストだけに使うDBを用意する。"
reflect = "docs/20_rules/テスト規約.md"

[[sheets.items]]
id = "app.external"
name = "外部連携の有無"
required = "必須"
description = """
選択：あり／なし／未定
未定のとき：外部連携の節を「未決定」として残し、未決定事項として報告する。"""
example = "あり"
choices = ["あり", "なし", "未定"]
reflect = "docs/20_rules/アーキテクチャ.md の利用者と外部システム"

[[sheets.items]]
id = "app.external_targets"
name = "外部連携の対象と責任分界"
required = "条件付き必須"
required_if = { id = "app.external", equals = "あり" }
description = "外部連携がある場合に書く。相手のシステムと、どこまでをこのアプリが受け持つか。"
example = "会計システム：発注のCSVを出力し、決まったフォルダに置くまでをこのアプリが受け持つ。"
note = """
外部連携：ほかのシステムとデータをやり取りすること（ファイルの受け渡し、APIの呼び出しなど）。
責任分界：どこまでをこのアプリが作り・運用し、どこからを相手のシステムが受け持つかの境目。"""
reflect = "docs/20_rules/アーキテクチャ.md の利用者と外部システム、必要な外部インタフェースの設計書"

[[sheets.items]]
id = "app.login"
name = "画面のログインの方式"
required = "任意"
description = "利用者が画面にログインする方式。"
example = "既定のまま"
default = "Amazon Cognito。パスワードと、ワンタイムパスワード（認証アプリ）の2要素認証"
note = """
Cognito：AWSのログインの仕組み。
ワンタイムパスワード：スマートフォンの認証アプリ（Google Authenticator、Microsoft Authenticator など）に出る、30秒ごとに変わる6桁の数字。
利用者は、初めてログインするときに、認証アプリを登録する。
社内の共通のログイン（シングルサインオン）を使う場合などだけ、記入する。"""
reflect = "docs/20_rules/アーキテクチャ.md の {{認証と環境の方針}}"

[[sheets.items]]
id = "app.user_registration"
name = "利用者の登録"
required = "任意"
description = "利用者の登録・削除を誰が行うか。"
example = "既定のまま"
default = "開発者が登録・削除する"
note = """
利用者を Cognito に登録・削除する人。
利用者が増えたり、退職したりしたときに、依頼を受けて登録・削除する。"""
reflect = "docs/20_rules/アーキテクチャ.md の {{認証と環境の方針}}、運用手順"

[[sheets.items]]
id = "app.roles"
name = "権限の分け方"
required = "任意"
description = "ログインした人ごとに、使える機能を分けるか。分ける場合は、権限の種類を書く。"
example = "参照だけの人と、更新もできる人の2種類"
default = "分けない（ログインできる人は、すべての機能を使える）"
note = """
認可：ログインした人に、何をしてよいかを決めること。
例：参照だけできる人と、更新もできる人を分ける。"""
reflect = "docs/20_rules/アーキテクチャ.md の {{認証と環境の方針}}"

[[sheets.items]]
id = "app.test_users"
name = "テストユーザー"
required = "任意"
description = "テスト用の利用者の用意と管理の方法。パスワードは書かない。"
example = "既定のまま"
default = "開発者ごとに1つ、開発者が作る"
note = """
テストでログインするための利用者。
パスワードは、このExcelに書かない。"""
reflect = "docs/20_rules/テスト規約.md、テストの進め方"

[[sheets.items]]
id = "app.publishing"
name = "画面とAPIの公開方式"
required = "任意"
description = "画面とAPIをどう公開するか。"
example = "既定のまま"
default = "画面とAPIを同じドメインで公開する。CloudFrontが、パスの先頭（サービス名）を見て、サービスごとのAPIに振り分ける"
note = """
CloudFront：画面とAPIを、利用者に届けるAWSの仕組み。URLのパスを見て、転送先を振り分けられる。
画面とAPIを同じドメインにすると、ブラウザーの制限（CORS）がかからず、事前の確認の通信（プリフライト）も起きない。
例：
https://asset.example.com/ → 画面
https://asset.example.com/lending/... → 貸出サービスのAPI
https://asset.example.com/purchase/... → 発注サービスのAPI"""
reflect = "docs/20_rules/アーキテクチャ.md の「画面とAPIの転送」「APIの転送の設定」「画面のURLの振り分け」、API共通仕様、フロントエンド実装方針、URL命名規則"

[[sheets.items]]
id = "app.glossary"
name = "業務用語"
required = "任意"
description = "用語集に載せる用語。インプット資料にあれば、その資料名とシートでよい。"
example = "インプット資料 No.2 の「用語」シート"
reflect = "docs/30_glossary/用語集.md"

[[sheets]]
key = "dev"
kind = "items"
name = "開発の進め方"
summary = "役割、テスト、設計書の置き場所、課題管理。"
lead = ["役割、テスト、設計書の置き場所、課題管理。", "黄色の「記入欄」に記入します。任意の項目は、空欄なら既定値を使います。"]

[[sheets.items]]
id = "dev.roles"
name = "人とAIの役割"
required = "任意"
description = "誰が何をするか。"
example = "既定のまま"
default = "AIが変更し、人がレビュー・コミット・プッシュ・マージする"
note = """
レビュー：変更の中身を人が確かめること。
コミット：変更を記録すること。
プッシュ：記録を共有の場所（GitHub）に送ること。
マージ：確かめた変更を本流に取り込むこと。"""
reflect = "AGENTS.md、docs/20_rules/リポジトリ規約.md の作業の流れと担当"

[[sheets.items]]
id = "dev.test_method"
name = "テストの方法"
required = "任意"
description = "単体テストと画面のテストの道具。"
example = "既定のまま"
default = "フロントエンドの単体テストはVitest（Nuxt環境では@nuxt/test-utils）、Pythonサービスの単体テストはpytest、画面のE2EテストはPlaywright"
note = """
単体テスト：関数やAPIを1つずつ確かめるテスト。
E2Eテスト：ブラウザーで画面を操作し、最初から最後まで確かめるテスト。
Playwright：ブラウザーを自動で操作する道具。"""
reflect = "docs/20_rules/テスト規約.md、テストの進め方"

[[sheets.items]]
id = "dev.test_data"
name = "テストデータ"
required = "任意"
description = "テストで使うデータの用意と後片付け。"
example = "既定のまま"
default = "テストごとに準備し、終わったら消す"
reflect = "docs/20_rules/テスト規約.md"

[[sheets.items]]
id = "dev.test_env"
name = "テスト環境とAPIの接続先"
required = "任意"
description = "テストで接続する環境と、共有の環境でのデータの準備・削除を誰がどう行うか。接続文字列やパスワードは書かない。"
