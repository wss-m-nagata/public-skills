example = "\\\\fileserver\\share\\asset-mgmt\\設計書\\作業中"
default = "設計書の正式版と同じ場所の「作業中」フォルダ"
note = "作業場：設計書を作る・直すときに、正式版とは別に使う場所。レビューが済んだら、正式版へ反映する。"
reflect = "docs/50_operation/AI駆動開発の運用/ の作業場の置き場所"

[[sheets.items]]
id = "dev.issue_tracker"
