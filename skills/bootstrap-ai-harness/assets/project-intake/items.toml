example = "DBの参照ツール（開発のDBの読み取りだけ）"
note = "AIが使ってよいツール（DBの参照ツール、ブラウザーの操作など）と、その範囲（読み取りだけ、など）。"
reflect = "AGENTS.md のツールの使い方"

[[sheets.items]]
id = "dev.extra_skills"
